# 테스트 전용 설정: 인메모리 H2 (MySQL 호환 모드). 운영 DB 에는 절대 연결하지 않는다.
spring:
  datasource:
    url: jdbc:h2:mem:moyeolog-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  # 테스트용 키 (Base64, 64바이트)
  secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLW1veWVvbG9nLWJhY2tlbmQtdGVzdHMtMDEyMzQ1Njc4OWFiY2RlZg==
  expiration: 3600000
  refresh-expiration: 604800000

internal:
  api-secret: test-internal-secret

gemini:
  api:
    key: ""

file:
  upload-dir: build/test-uploads
